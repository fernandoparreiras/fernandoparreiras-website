<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">O novo desenvolvedor responde pelo fluxo</title>
  <desc id="desc">Infográfico do SDLC AI-native com as camadas valor, entrega e confiança conectadas ao ciclo hipótese, mudança reversível, evidência, produção e aprendizado.</desc>
  <rect width="1200" height="1200" fill="#080909"/>
  <rect x="56" y="56" width="1088" height="1088" fill="none" stroke="#d8ff57" stroke-width="2"/>

  <text x="92" y="126" fill="#d8ff57" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5">AGILIDADE × IA · SDLC AI-NATIVE</text>
  <text x="92" y="212" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="800">O NOVO DESENVOLVEDOR</text>
  <text x="92" y="276" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="800">RESPONDE PELO <tspan fill="#d8ff57">FLUXO</tspan></text>

  <g transform="translate(92 352)">
    <rect width="1016" height="128" rx="2" fill="#141617" stroke="#343839"/>
    <rect width="10" height="128" fill="#d8ff57"/>
    <text x="42" y="45" fill="#d8ff57" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">01 · VALOR</text>
    <text x="42" y="88" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="700">Problema → hipótese → resultado observável</text>
    <text x="720" y="79" fill="#92989a" font-family="Arial, sans-serif" font-size="18">O que merece mudar?</text>
  </g>

  <path d="M600 480v30m-14-14 14 14 14-14" fill="none" stroke="#d8ff57" stroke-width="3"/>

  <g transform="translate(92 522)">
    <rect width="1016" height="128" rx="2" fill="#141617" stroke="#343839"/>
    <rect width="10" height="128" fill="#d8ff57"/>
    <text x="42" y="45" fill="#d8ff57" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">02 · ENTREGA</text>
    <text x="42" y="88" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="700">SPEC → construir → integrar → liberar</text>
    <text x="720" y="79" fill="#92989a" font-family="Arial, sans-serif" font-size="18">Como chega ao usuário?</text>
  </g>

  <path d="M600 650v30m-14-14 14 14 14-14" fill="none" stroke="#d8ff57" stroke-width="3"/>

  <g transform="translate(92 692)">
    <rect width="1016" height="128" rx="2" fill="#d8ff57"/>
    <text x="42" y="45" fill="#263000" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="3">03 · CONFIANÇA</text>
    <text x="42" y="91" fill="#080909" font-family="Arial, sans-serif" font-size="27" font-weight="800">Evidência → segurança → readback → aprendizado</text>
    <text x="720" y="43" fill="#263000" font-family="Arial, sans-serif" font-size="16">Como sabemos que funcionou?</text>
  </g>

  <text x="92" y="900" fill="#92989a" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">A UNIDADE DE PRODUTIVIDADE É A MUDANÇA ACEITA</text>

  <g transform="translate(92 938)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="164" height="76" fill="#141617" stroke="#343839"/>
    <text x="82" y="46" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">HIPÓTESE</text>
    <path d="M174 38h34m-12-12 12 12-12 12" fill="none" stroke="#d8ff57" stroke-width="3"/>
    <rect x="218" y="0" width="190" height="76" fill="#141617" stroke="#343839"/>
    <text x="313" y="31" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">MUDANÇA</text>
    <text x="313" y="54" fill="#92989a" font-size="15" text-anchor="middle">REVERSÍVEL</text>
    <path d="M418 38h34m-12-12 12 12-12 12" fill="none" stroke="#d8ff57" stroke-width="3"/>
    <rect x="462" y="0" width="164" height="76" fill="#141617" stroke="#343839"/>
    <text x="544" y="46" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">EVIDÊNCIA</text>
    <path d="M636 38h34m-12-12 12 12-12 12" fill="none" stroke="#d8ff57" stroke-width="3"/>
    <rect x="680" y="0" width="164" height="76" fill="#141617" stroke="#343839"/>
    <text x="762" y="46" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">PRODUÇÃO</text>
    <path d="M854 38h34m-12-12 12 12-12 12" fill="none" stroke="#d8ff57" stroke-width="3"/>
    <rect x="898" y="0" width="118" height="76" fill="#d8ff57"/>
    <text x="957" y="31" fill="#080909" font-size="15" font-weight="800" text-anchor="middle">APREN-</text>
    <text x="957" y="53" fill="#080909" font-size="15" font-weight="800" text-anchor="middle">DIZADO</text>
  </g>

  <path d="M1049 1036c0 56-64 64-136 64H218c-72 0-126-10-126-64" fill="none" stroke="#343839" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M92 1036l-10 18 20-1z" fill="#d8ff57"/>
  <text x="92" y="1092" fill="#92989a" font-family="Arial, sans-serif" font-size="18">Autonomia no fluxo inteiro. Autoridade humana nos riscos.</text>
</svg>
